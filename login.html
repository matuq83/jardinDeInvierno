<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ingresar · Administrador</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{margin:0;min-height:100dvh;color:#fff;background:#1d1b1a}
    .bg{position:fixed;inset:0;background-image:var(--bg,none),linear-gradient(135deg,#2b201e,#7a4a42);background-size:cover;background-position:center}
    .bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.75))}
    .wrap{position:relative;min-height:100dvh;display:grid;align-content:center;justify-items:center;gap:24px;padding:24px 16px max(24px,env(safe-area-inset-bottom))}
    .cap{width:min(100%,420px);text-align:left}
    .eyebrow{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
    .cap h1{margin:0;font-size:clamp(28px,7vw,40px);line-height:1.1;overflow-wrap:anywhere}
    .cap p:last-child{margin:10px 0 0;opacity:.92}
    form{width:min(100%,420px);background:rgba(255,255,255,.95);color:#1d1b1a;border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
    h2{margin:0 0 16px;font-size:20px}
    label{display:block;font-weight:700;font-size:13px;margin-bottom:14px}
    input{width:100%;margin-top:6px;padding:12px;border:1px solid #d6d0cc;border-radius:10px;font-size:16px}
    input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
    button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    button:hover{background:var(--accent-dark)}button:disabled{opacity:.6}
    #err{min-height:20px;margin:0 0 10px;color:#a33;font-size:14px}
    form a{display:block;margin-top:16px;text-align:center;color:#6f6a68;font-size:14px}
  </style>
</head>
<body>
  <div class="bg" id="bg"><video id="bgv" muted loop playsinline autoplay hidden></video></div>
  <div class="shade"></div>
  <div class="wrap">
    <div class="cap"><p class="eyebrow" id="capE">Administrador</p><h1 id="capT">Panel de administración</h1><p id="capP"></p></div>
    <form id="f">
      <h2>Ingresar</h2>
      <label>Usuario<input id="u" autocomplete="username" required></label>
      <label>Contraseña<input id="p" type="password" autocomplete="current-password" required></label>
      <p id="err" role="alert"></p>
      <button id="go">Ingresar</button>
      <a href="index.html">Volver al menú</a>
    </form>
  </div>
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script>
    if (Auth.isIn()) location.replace("admin.html");
    // Fondo y leyenda: los mismos que se configuran en el panel
    (() => {
      let d = window.MENU_DATA || {};
      try { const s = localStorage.getItem("jardinInviernoMenuV2"); if (s) d = JSON.parse(s); } catch(e){}
      const pn = d.panel || {}, bg = document.getElementById("bg"), v = document.getElementById("bgv");
      if (pn.image) bg.style.setProperty("--bg", `url("${String(pn.image).replace(/"/g, "%22")}")`);
      if (pn.video && !matchMedia("(prefers-reduced-motion: reduce)").matches){ v.src = pn.video; v.hidden = false; v.onerror = () => { v.hidden = true; }; try { const pr = v.play && v.play(); if (pr && pr.catch) pr.catch(() => {}); } catch(e){} }
      if (d.restaurant?.name) capE.textContent = d.restaurant.name;
      capT.textContent = pn.title || "Panel de administración";
      capP.textContent = pn.text || "Ingresá para gestionar tu carta, tus promos y la información de tu local.";
    })();
    let fails = 0;
    f.onsubmit = async e => {
      e.preventDefault();
      go.disabled = true;
      if (await Auth.login(u.value, p.value)) return location.replace("admin.html");
      fails++; err.textContent = "Usuario o contraseña incorrectos.";
      p.value = ""; p.focus();
      setTimeout(() => go.disabled = false, fails >= 3 ? 10000 : 500);
      if (fails >= 3) err.textContent += " Esperá 10 segundos para reintentar.";
    };
  </script>
</body>
</html>
