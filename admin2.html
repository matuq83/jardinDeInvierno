<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administrador · Jardín de Invierno</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--ac:#b65f52;--ac-d:#8f453b;--ink:#1d1b1a;--mut:#6f6a68;--line:#e9e4e1}
    body{background:#f4f1ef;color:var(--ink)}
    .banner{position:relative;min-height:clamp(190px,30vw,280px);display:flex;align-items:flex-end;overflow:hidden;color:#fff;
      background-image:var(--bg,none),linear-gradient(135deg,#2b201e,#7a4a42);background-size:cover;background-position:center}
    .banner-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .banner-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.72))}
    .banner-copy{position:relative;z-index:1;width:min(100%,1100px);margin:0 auto;padding:24px 16px 26px}
    .eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
    .banner h1{margin:0;font-size:clamp(26px,5vw,42px);line-height:1.1;overflow-wrap:anywhere}
    #bannerText{margin:8px 0 0;max-width:560px;opacity:.92}
    .glass{position:absolute;z-index:2;top:max(12px,env(safe-area-inset-top));right:14px;padding:9px 14px;border:1px solid rgba(255,255,255,.45);border-radius:99px;background:rgba(255,255,255,.16);color:#fff;backdrop-filter:blur(8px);cursor:pointer;font-size:14px}
    .jump{position:sticky;top:0;z-index:15;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:rgba(244,241,239,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}
    .jump a{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:14px;font-weight:500}
    .jump a:hover{border-color:var(--ac);color:var(--ac)}
    .admin{max-width:1100px;margin:auto;padding:6px 16px 130px}
    .panel{scroll-margin-top:64px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 2px 10px rgba(0,0,0,.04)}
    .panel h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:19px}
    .h-ico{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#f7e9e6;color:var(--ac)}
    .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .full{grid-column:1/-1}
    label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}
    input,textarea,select{width:100%;padding:11px;border:1px solid #d6d0cc;border-radius:10px;font-size:16px;background:#fff}
    input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:var(--ac)}
    input[type=checkbox]{width:auto;accent-color:var(--ac)}input[type=file]{padding:7px;font-size:13px;margin-top:6px}
    textarea{min-height:80px;resize:vertical}
    button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer;background:var(--ink);color:#fff;font-size:14px;font-weight:500}
    button.secondary{background:#fff;color:var(--ink);border:1px solid #cfc8c4}
    button.danger{background:#fff;color:#b3261e;border:1px solid #e5b5b1}button.small{padding:7px 11px}
    #save{background:var(--ac)}#save:hover{background:var(--ac-d)}
    .item-row{border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px;margin-top:12px}
    .actions-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .hint{color:var(--mut);font-size:13px;margin:0 0 12px}.thumb{height:64px;border-radius:10px;margin-top:8px;object-fit:cover}
    details.cat{border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#fcfbfa}
    details.cat>summary{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:700;list-style:none}
    details.cat>summary::-webkit-details-marker{display:none}
    details.cat>summary::after{content:"▾";margin-left:auto;transition:transform .2s;color:var(--mut)}
    details.cat[open]>summary::after{transform:rotate(180deg)}
    .badge{padding:3px 10px;border-radius:99px;background:#f7e9e6;color:var(--ac);font-size:12px;font-weight:700}
    .cat-body{padding:0 16px 16px}
    .bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));z-index:20;width:max-content;max-width:calc(100% - 20px);
      background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.18);
      padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
    .bar a{display:inline-flex;align-items:center;padding:0 8px;color:var(--ink);font-size:14px}
    #dirty{font-size:13px;font-weight:700;color:#b26a00}
    #toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:30}
    @media(max-width:600px){.row{grid-template-columns:1fr}.panel{padding:16px;border-radius:16px}}
  </style>
</head>
<body>
<header id="banner" class="banner">
  <video id="bannerVideo" class="banner-video" muted loop playsinline autoplay hidden></video>
  <div class="banner-shade"></div>
  <button class="glass" id="logout">Cerrar sesión</button>
  <div class="banner-copy"><p class="eyebrow">Panel de administración</p><h1 id="bannerTitle"></h1><p id="bannerText"></p></div>
</header>
<nav class="jump" aria-label="Secciones">
  <a href="#s-panel">Fondo y leyenda</a><a href="#s-general">General</a><a href="#s-social">Redes</a>
  <a href="#s-services">Servicios</a><a href="#s-slider">Slider</a><a href="#s-menu">Carta</a>
</nav>
<main class="admin">
  <!-- <p class="hint">Los cambios se guardan en este navegador. Para publicarlos a todos los clientes: “Descargar data.js”, reemplazá ese archivo en tu proyecto y volvé a subirlo (o conectá una base de datos).</p> -->
  <div id="app"></div>
</main>
<div class="bar">
  <span id="dirty" hidden>● Cambios sin guardar</span>
  <button id="save">Guardar cambios</button>
  <button id="download" class="secondary">Descargar data.js</button>
  <button id="reset" class="secondary">Restaurar originales</button>
  <a href="index.html">Ver menú</a>
</div>
<script src="auth.js"></script>
<script>Auth.require();</script>
<script src="data.js"></script>
<script src="script.js"></script>
<script>
(() => {
  const app = MenuApp, $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let data = app.getData();
  const ICONS = {"panel": "<rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" ry=\"2\"/> <circle cx=\"9\" cy=\"9\" r=\"2\"/> <path d=\"m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21\"/>", "general": "<path d=\"M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5\"/> <path d=\"M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244\"/> <path d=\"M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05\"/>", "social": "<circle cx=\"18\" cy=\"5\" r=\"3\"/> <circle cx=\"6\" cy=\"12\" r=\"3\"/> <circle cx=\"18\" cy=\"19\" r=\"3\"/> <line x1=\"8.59\" x2=\"15.42\" y1=\"13.51\" y2=\"17.49\"/> <line x1=\"15.41\" x2=\"8.59\" y1=\"6.51\" y2=\"10.49\"/>", "services": "<path d=\"M3 20a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1Z\"/> <path d=\"M20 16a8 8 0 1 0-16 0\"/> <path d=\"M12 4v4\"/> <path d=\"M10 4h4\"/>", "slider": "<path d=\"M2 3v18\"/> <rect width=\"12\" height=\"18\" x=\"6\" y=\"3\" rx=\"2\"/> <path d=\"M22 3v18\"/>", "menu": "<path d=\"M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2\"/> <path d=\"M7 2v20\"/> <path d=\"M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7\"/>"};
  const ico = n => `<span class="h-ico">${app.svg(ICONS[n])}</span>`;
  const openCats = new Set([0]);
  let dirty = false;
  const setDirty = v => { dirty = v; $("#dirty").hidden = !v; };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function paintBanner(){
    const p = data.panel || {}, b = $("#banner"), v = $("#bannerVideo");
    b.style.setProperty("--bg", p.image ? `url("${String(p.image).replace(/"/g, "%22")}")` : "none");
    if (p.video && !reduce){
      if (v.getAttribute("src") !== p.video) v.src = p.video;
      v.hidden = false; v.onerror = () => { v.hidden = true; }; try { const pr = v.play && v.play(); if (pr && pr.catch) pr.catch(() => {}); } catch(e){}
    } else { v.hidden = true; v.removeAttribute("src"); }
    $("#bannerTitle").textContent = p.title || "Administrador del menú";
    $("#bannerText").textContent = p.text || "";
  }

  const field = (label, p, v, cls = "") => `<div class="${cls}"><label>${label}</label><input data-p="${p}" value="${esc(v)}"></div>`;
  const image = (label, p, v) => `<div><label>${label}</label><input data-p="${p}" value="${esc(v && v.startsWith("data:") ? "" : v)}" placeholder="URL, ruta o subir archivo">
    <input type="file" accept="image/*" data-file="${p}">${v ? `<img class="thumb" src="${esc(v)}" alt=""><div class="actions-row"><button type="button" class="small danger" data-act="clearimg:${p}">Quitar imagen</button></div>` : ""}</div>`;
  const mv = (arr, i, d) => { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; };
  const btns = (k, ids, label) => `<div class="actions-row">
    <button class="small secondary" data-act="up:${k}:${ids}" aria-label="Subir">↑</button>
    <button class="small secondary" data-act="down:${k}:${ids}" aria-label="Bajar">↓</button>
    <button class="small danger" data-act="del:${k}:${ids}">Eliminar ${label}</button></div>`;

  function draw(){
    const r = data.restaurant, pn = data.panel || {};
    $("#app").innerHTML = `
    <div class="panel" id="s-panel"><h2>${ico("panel")} Fondo y leyenda del panel</h2>
      <p class="hint">Es la imagen o el video que se ve arriba del panel y en la pantalla de ingreso, con una leyenda a elección (por ejemplo, el lema del restaurante). Se actualiza mientras escribís.</p>
      <div class="row">
        ${field("Leyenda (título)","panel.title",pn.title)}${field("Texto de apoyo","panel.text",pn.text)}
        ${image("Imagen de fondo","panel.image",pn.image)}
        ${field("Video de fondo (opcional)","panel.video",pn.video)}
        <p class="hint full">El video se muestra en lugar de la imagen. No se puede subir desde acá: ponelo en la carpeta del proyecto (por ejemplo videos/fondo.mp4) y escribí esa ruta, o usá un link directo a un .mp4 o .webm. Conviene que sea liviano (menos de 5 MB) y sin sonido. Si falla, se ve la imagen.</p>
      </div></div>
    <div class="panel" id="s-general"><h2>${ico("general")} Datos generales</h2><div class="row">
      ${field("Nombre","restaurant.name",r.name)}${field("Subtítulo","restaurant.subtitle",r.subtitle)}
      ${image("Logo","restaurant.logo",r.logo)}${image("Imagen principal","restaurant.hero",r.hero)}
      ${field("Link de reservas","restaurant.reservationUrl",r.reservationUrl)}${field("Link de WhatsApp","restaurant.whatsapp",r.whatsapp)}
      ${field("Link para dejar reseñas","restaurant.reviewUrl",r.reviewUrl,"full")}
      <p class="hint full">WhatsApp: usá el formato https://wa.me/549XXXXXXXXXX (código de país + área + número, sin signos). Reseñas: en Google Business Profile → “Pedir reseñas” te dan un link corto. Si dejás un campo vacío, ese botón no se muestra.</p>
      <div class="full"><label>Horarios (uno por línea)</label><textarea data-p="hours" data-lines>${esc(data.hours.join("\n"))}</textarea></div>
    </div></div>
    <div class="panel" id="s-social"><h2>${ico("social")} Redes sociales</h2>
      <p class="hint">Pegá el link de cada perfil. Solo se muestran las que completes, y aparecen como íconos al final del menú.</p>
      <div class="row">${app.SOCIAL.map(s=>field(s[1],"restaurant.social."+s[0],r.social?.[s[0]])).join("")}</div></div>
    <div class="panel" id="s-services"><h2>${ico("services")} Servicios del local</h2><div class="row">
      ${app.AMENITIES.map(a=>`<label style="font-weight:400"><input type="checkbox" data-p="amenities.${a[0]}" ${data.amenities?.[a[0]]?"checked":""}> ${app.svg(a[1])} ${a[2]}</label>`).join("")}
    </div></div>
    <div class="panel" id="s-slider"><h2>${ico("slider")} Slider</h2>
      ${data.slides.map((s,i)=>`<div class="item-row"><div class="row">
        ${field("Título",`slides.${i}.title`,s.title)}${field("Texto",`slides.${i}.text`,s.text)}
        ${image("Imagen",`slides.${i}.image`,s.image)}
        <div><label><input type="checkbox" data-p="slides.${i}.active" ${s.active!==false?"checked":""}> Visible</label></div>
      </div>${btns("slide",i,"slide")}</div>`).join("")}
      <button data-act="add:slide">+ Agregar slide</button></div>
    <div class="panel" id="s-menu"><h2>${ico("menu")} Categorías y productos</h2>
      ${data.categories.map((c,ci)=>`<details class="cat" data-ci="${ci}" ${openCats.has(ci)?"open":""}><summary><span>${esc(c.name)||"Sin nombre"}</span><span class="badge">${c.items.length} producto${c.items.length===1?"":"s"}</span></summary><div class="cat-body"><div class="row">
        ${field("Categoría",`categories.${ci}.name`,c.name)}${image("Icono",`categories.${ci}.icon`,c.icon)}</div>
        ${btns("cat",ci,"categoría")}
        ${c.items.map((it,ii)=>`<div class="item-row"><div class="row">
          ${field("Producto",`categories.${ci}.items.${ii}.name`,it.name)}${field("Precio",`categories.${ci}.items.${ii}.price`,it.price)}
          <div><label>Descripción</label><textarea data-p="categories.${ci}.items.${ii}.description">${esc(it.description)}</textarea></div>
          ${image("Imagen",`categories.${ci}.items.${ii}.image`,it.image)}
          <div><label><input type="checkbox" data-p="categories.${ci}.items.${ii}.available" ${it.available!==false?"checked":""}> Disponible</label></div>
          <div class="full">${app.DIET.map(d=>`<label style="display:inline-block;margin-right:14px;font-weight:400"><input type="checkbox" data-p="categories.${ci}.items.${ii}.diet.${d[0]}" ${it.diet?.[d[0]]?"checked":""}> ${d[2]}</label>`).join("")}</div>
        </div>${btns("item",ci+":"+ii,"producto")}</div>`).join("")}
        <div class="actions-row"><button data-act="add:item:${ci}">+ Agregar producto</button></div></div></details>`).join("")}
      <button data-act="add:cat">+ Agregar categoría</button></div>`;
    paintBanner();
  }

  function collect(){
    document.querySelectorAll("[data-p]").forEach(el => {
      const k = el.dataset.p.split("."), last = k.pop();
      const o = k.reduce((a, x) => a[x], data);
      o[last] = el.type === "checkbox" ? el.checked : "lines" in el.dataset ? el.value.split("\n").map(x => x.trim()).filter(Boolean) : el.value;
    });
  }
  // Conserva la imagen subida si el campo de texto quedó vacío por ser data: URL
  const keepUploads = old => document.querySelectorAll("[data-file]").forEach(el => {
    const k = el.dataset.file.split("."), last = k.pop();
    try { const prev = k.reduce((a,x)=>a[x], old)[last]; const o = k.reduce((a,x)=>a[x], data); if (!o[last] && prev?.startsWith("data:")) o[last] = prev; } catch(e){}
  });
  const sync = () => { const old = JSON.parse(JSON.stringify(data)); collect(); keepUploads(old); };

  function resize(file, max = 800){ return new Promise(res => {
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = im.width * s; cv.height = im.height * s; cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
      res(cv.toDataURL("image/jpeg", .75)); }; im.src = rd.result; };
    rd.readAsDataURL(file); }); }

  const toast = t => { const el = document.createElement("div"); el.id = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); };
  const path = p => p.split(".").reduce((a, x) => a[x], data);

  document.addEventListener("change", async e => {
    if (!e.target.dataset.file || !e.target.files[0]) return;
    const p = e.target.dataset.file, url = await resize(e.target.files[0], p === "panel.image" ? 1600 : 800);
    sync(); setDirty(true); const k = p.split("."), last = k.pop(); k.reduce((a, x) => a[x], data)[last] = url; draw();
  });

  document.addEventListener("click", e => {
    const a = e.target.dataset.act; if (!a) return;
    sync(); setDirty(true);
    const [op, kind, x, y] = a.split(":");
    if (op === "clearimg"){
      const k = kind.split("."), last = k.pop();
      k.reduce((o, z) => o[z], data)[last] = "";
      draw(); toast("Imagen quitada. Recordá guardar los cambios."); return;
    }
    if (op === "add"){
      if (kind === "slide") data.slides.push({ title: "Nuevo slide", text: "", image: "", active: true });
      if (kind === "cat"){ data.categories.push({ id: "cat-" + Date.now(), name: "Nueva categoría", icon: "", items: [] }); openCats.add(data.categories.length - 1); }
      if (kind === "item") data.categories[+x].items.push({ name: "Nuevo producto", description: "", price: "", image: "", available: true, diet: {} });
    } else {
      const list = kind === "slide" ? data.slides : kind === "cat" ? data.categories : data.categories[+x].items;
      const i = kind === "item" ? +y : +x;
      if (kind === "cat") openCats.clear();
      if (kind === "cat" && op === "up") openCats.add(i - 1);
      if (kind === "cat" && op === "down") openCats.add(i + 1);
      if (op === "del" && confirm("¿Eliminar? Esta acción no se puede deshacer hasta que restaures los datos.")) list.splice(i, 1);
      if (op === "up") mv(list, i, -1);
      if (op === "down") mv(list, i, 1);
    }
    draw();
  });

  $("#save").onclick = () => { sync(); try { app.saveData(data); toast("Cambios guardados"); setDirty(false); } catch(e){ alert("No hay espacio en el navegador. Usá URLs en vez de subir imágenes."); } };
  $("#download").onclick = () => { sync();
    const b = new Blob(["window.MENU_DATA = " + JSON.stringify(data, null, 2) + ";\n"], { type: "text/javascript" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "data.js"; a.click(); };
  $("#reset").onclick = () => { if (confirm("¿Restaurar los datos originales?")){ app.reset(); data = app.getData(); draw(); } };
  $("#logout").onclick = () => Auth.logout();
  document.addEventListener("input", e => { setDirty(true); if (e.target.dataset?.p?.startsWith("panel.")){ sync(); paintBanner(); } });
  document.addEventListener("toggle", e => { const d = e.target; if (d.dataset?.ci !== undefined){ const i = +d.dataset.ci; d.open ? openCats.add(i) : openCats.delete(i); } }, true);
  addEventListener("beforeunload", e => { if (dirty){ e.preventDefault(); e.returnValue = ""; } });
  draw();
})();
</script>
</body>
</html>
