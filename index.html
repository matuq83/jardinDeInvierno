<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Jardín de Invierno Restaurante</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="topbar">
    <button id="menuBtn" class="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="drawer"><span></span><span></span><span></span></button>
    <strong id="topName"></strong>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Menú de navegación" aria-hidden="true">
    <button id="drawerClose" class="drawer-close" aria-label="Cerrar menú">×</button>
    <nav id="drawerNav"></nav>
  </aside>

  <main class="container" id="top">
    <header class="hero">
      <img id="restaurantLogo" class="logo" alt="Logo del restaurante">
      <div class="hero-media">
        <img id="heroImage" class="hero-background" alt="">
        <div class="hero-overlay"></div>
        <div class="hero-content"><h1 id="restaurantName"></h1><p id="restaurantSubtitle"></p></div>
      </div>
    </header>

    <section class="actions" aria-label="Acciones">
      <a id="reserveLink" class="action action-accent" target="_blank" rel="noopener"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3"/> <path d="M16 2v3"/> <rect x="3" y="3" width="18" height="18" rx="2"/> <path d="M3 9h18"/> <path d="m9 15 2 2 4-4"/></svg>Reservar mesa</a>
    </section>

    <section class="hours"><strong>Horarios</strong><select id="hoursSelect" aria-label="Horarios"></select></section>

    <section id="slider" class="slider" aria-label="Promociones">
      <div id="slidesTrack" class="slides-track"></div>
      <button class="slider-btn prev" id="slidePrev" aria-label="Anterior">‹</button>
      <button class="slider-btn next" id="slideNext" aria-label="Siguiente">›</button>
      <div id="slideDots" class="slide-dots"></div>
    </section>

    <div class="search-bar"><span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="Buscar productos por nombre o descripción"></div>

    <nav id="categories" class="categories" aria-label="Categorías"></nav>
    <div id="menu"></div>
    <div id="emptyState" class="empty-state" hidden>No encontramos productos con esa búsqueda.</div>

    <section id="reviewCta" class="review-cta" hidden>
      <div class="stars" aria-hidden="true">★★★★★</div>
      <h2>¿Cómo fue tu experiencia?</h2>
      <p>Tu opinión nos ayuda a mejorar y a que más personas nos conozcan.</p>
      <a id="reviewLink" class="action action-accent" target="_blank" rel="noopener">Dejar mi reseña</a>
    </section>

    <section id="amenities" class="amenities" hidden></section>

    <footer class="footer">
      <div id="socials" class="socials" hidden></div>
      <p id="footerName"></p>
      <p class="powered">Powered by Matias Quintana</p>
      <a href="login.html" class="admin-link">Acceso administrador</a>
    </footer>
  </main>
  <dialog id="itemModal" class="modal" aria-label="Detalle del producto">
    <button id="modalClose" class="modal-close" aria-label="Cerrar">×</button>
    <div id="modalBody"></div>
  </dialog>
  <a id="whatsappLink" class="wa-fab" target="_blank" rel="noopener" aria-label="Escribinos por WhatsApp" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></a>
  <button id="backToTop" aria-label="Volver arriba">↑</button>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
